<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body {
    background: transparent;
    margin: 0;
    padding: 0;
  }
  body {
    /* the cat is the whole window: nothing may ever scroll here. */
    overflow: hidden;
    color: #e7e9ee;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  /* fixed: the cat fills the whole viewport and body no longer scrolls, so a
     banner in normal flow would sit permanently off-screen. */
  /* ponytail: the DS has no alert component — this is a panel wearing the
     danger border, so it stays a token composition rather than a new look. */
  #err {
    position: fixed;
    left: 0; right: 0; top: 0;
    z-index: 20;
    font-family: var(--hcds-font-sans);
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--hcds-fg);
    background: var(--hcds-surface-raised);
    border: 1px solid var(--hcds-danger);
    border-radius: var(--hcds-radius-control);
    box-shadow: var(--hcds-shadow-panel);
    padding: 10px 14px;
    margin: 12px 16px 0;
  }
  #err:empty { display: none; }

  :focus-visible { outline: 2px solid var(--hcds-accent); outline-offset: 2px; }

  /* --- menu clic droit ---------------------------------------------- */
  /* drawn in the page, not by Menu.popup(): a native menu's look is the OS's
     business, and this one has to match the settings window. */
  #ctxmenu {
    position: fixed;
    left: 0; top: 0;
    z-index: 10;
    min-width: 128px;
    background: var(--hcds-surface-raised);
    border: 1px solid var(--hcds-border);
    border-radius: var(--hcds-radius-panel);
    padding: 4px;
    /* ponytail: shadow-popover is tuned for the light theme and vanishes over a
       transparent overlay, so a plain dark drop is layered under it. */
    box-shadow: var(--hcds-shadow-popover), 0 10px 28px oklch(0% 0 0 / 0.5);
  }
  #ctxmenu[hidden] { display: none; }
  #ctxmenu button {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    height: 32px;
    box-sizing: border-box;
    font-family: var(--hcds-font-sans);
    font-size: 0.875rem;
    line-height: 1.25rem;
    white-space: nowrap;
    text-align: left;
    color: var(--hcds-fg);
    background: none;
    border: 0;
    border-radius: var(--hcds-radius-control);
    /* left padding leaves the ✓ column its 8px + glyph */
    padding: 6px 8px 6px 28px;
    cursor: pointer;
  }
  #ctxmenu button:hover, #ctxmenu button:focus { background: var(--hcds-accent-subtle); }
  #ctxmenu hr { border: 0; height: 1px; background: var(--hcds-border); margin: 4px 0; }
  /* the two checkbox items of the tray menu, mirrored — no new state, the
     body classes main already toggles say everything. */
  #ctxmenu button::before {
    content: '';
    position: absolute;
    left: 8px;
    color: var(--hcds-accent);
  }
  body.fullscreen #ctxmenu [data-action="fullscreen"]::before,
  body.settings-open #ctxmenu [data-action="settings"]::before { content: '✓'; }

  /* --- mascotte ------------------------------------------------------- */
  /* overlay mode: the cat IS the window; renderer.ts drags it manually via IPC. */
  #persona {
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  /* display:block or the inline SVG sits on a text baseline and the few px of
     descender space below it are enough to trigger a scrollbar at 100vh. */
  #cat { width: 100%; height: 100%; display: block; }

  /* fullscreen: solid backing so the desktop never shows through behind the
     cat on a projector, and the cat scales to fill the viewport. */
  body.fullscreen {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  body.fullscreen #persona { width: min(90vh, 90vw); height: auto; aspect-ratio: 1 / 1; margin: 0; cursor: default; }

  #cat g, #cat path, #cat rect, #cat circle, #cat ellipse {
    transition: transform 800ms ease-in-out, opacity 800ms ease-in-out, fill 800ms ease-in-out;
    /* CSS transforms on SVG need a box, or parts rotate about the viewBox
       origin instead of their own. */
    transform-box: fill-box;
  }
  #whole, .ear-l, .ear-r { transform-origin: 50% 100%; }

  /* `d` does not transition, so the shapes whose outline genuinely changes
     are all drawn and cross-faded. Kept to the mouth and the shut eyes;
     everything else moves. */
  #m-content, #m-attentif, #m-inquiet, #m-fache, #eyes-shut, #brows { opacity: 0; }
  .content #m-content, .attentif #m-attentif,
  .inquiet #m-inquiet, .fache #m-fache { opacity: 1; }
  .fache #eyes-open { opacity: 0; }
  .fache #eyes-shut { opacity: 1; }
  /* the worried brows land where the upper tabby stripes already sit, so the
     two swap rather than pile up */
  .inquiet #brows { opacity: 1; }
  .inquiet .cheek-top { opacity: 0; }

  /* mood colour lives in the disc, never in the fur */
  .content  #halo { fill: #5cbf74; }
  .attentif #halo { fill: #e8b93c; }
  .inquiet  #halo { fill: #ef8b3c; }
  .fache    #halo { fill: #e0503f; }

  /* The mood is carried almost entirely by the ears: up and loose, then
     perked, then half down, then flat out sideways. It is the cat signal for
     "too much noise", and being a pure rotation it morphs with no cross-fade. */
  .content .ear-l { transform: rotate(-5deg); }
  .content .ear-r { transform: rotate(5deg); }

  .attentif #whole { transform: translateY(-5px); }
  .attentif .ear-l { transform: rotate(4deg); }
  .attentif .ear-r { transform: rotate(-4deg); }
  .attentif .pupil { transform: scale(1.3); }

  .inquiet #whole { transform: translateY(5px) scaleY(0.97); }
  .inquiet .ear-l { transform: rotate(-45deg); }
  .inquiet .ear-r { transform: rotate(45deg); }

  /* fache: overwhelmed — ears flat, eyes squeezed shut. Never a scowl: it is
     "c'est trop fort", not anger at the class. */
  .fache #whole { transform: translateY(9px) scaleY(0.93) scaleX(1.04); }
  .fache .ear-l { transform: rotate(-68deg); }
  .fache .ear-r { transform: rotate(68deg); }
</style>
</head>
<body>
<div id="persona">
<svg id="cat" class="content" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle id="halo" cx="100" cy="106" r="90" fill="#5cbf74" opacity="0.9" />

  <g id="whole">
    <!-- Silhouette pass: every outlined shape is stroked here and re-filled
         in the pass below, so the ear/head seams are covered and the outline
         reads as one continuous line while the ears stay separate,
         independently rotatable elements. -->
    <g fill="#3b342c" stroke="#3b342c" stroke-width="12" stroke-linejoin="round">
      <path class="ear-l" d="M 50 76 L 58 20 L 104 54 Z" />
      <path class="ear-r" d="M 150 76 L 142 20 L 96 54 Z" />
      <rect x="34" y="52" width="132" height="116" rx="46" />
    </g>

    <g stroke="none">
      <g class="ear-l">
        <path d="M 50 76 L 58 20 L 104 54 Z" fill="#b29a78" />
        <path d="M 62 68 L 66 34 L 92 55 Z" fill="#d99a97" />
      </g>
      <g class="ear-r">
        <path d="M 150 76 L 142 20 L 96 54 Z" fill="#b29a78" />
        <path d="M 138 68 L 134 34 L 108 55 Z" fill="#d99a97" />
      </g>
      <rect x="34" y="52" width="132" height="116" rx="46" fill="#b29a78" />
      <ellipse cx="100" cy="142" rx="30" ry="18" fill="#efe6d6" />
    </g>

    <!-- tabby markings from the photo: forehead "M" and cheek stripes -->
    <g fill="none" stroke="#3b342c" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="7" d="M 80 84 L 88 66 L 96 79 L 104 66 L 112 79 L 120 84" />
      <path class="cheek-top" stroke-width="5" d="M 42 96 Q 52 91 62 93" />
      <path class="cheek-top" stroke-width="5" d="M 158 96 Q 148 91 138 93" />
      <path stroke-width="5" d="M 44 111 Q 54 107 63 109" />
      <path stroke-width="5" d="M 156 111 Q 146 107 137 109" />
    </g>

    <g id="eyes-open">
      <ellipse cx="72" cy="112" rx="14" ry="16" fill="#b9c24a" />
      <ellipse cx="128" cy="112" rx="14" ry="16" fill="#b9c24a" />
      <ellipse class="pupil" cx="72" cy="112" rx="6.5" ry="9" fill="#201d19" />
      <ellipse class="pupil" cx="128" cy="112" rx="6.5" ry="9" fill="#201d19" />
      <circle cx="67" cy="105" r="3.5" fill="#fff" />
      <circle cx="123" cy="105" r="3.5" fill="#fff" />
    </g>

    <!-- squeezed shut: arcs bulge DOWN. Bulging up would read as laughing. -->
    <g id="eyes-shut" fill="none" stroke="#3b342c" stroke-width="7" stroke-linecap="round">
      <path d="M 58 105 Q 72 124 86 105" />
      <path d="M 114 105 Q 128 124 142 105" />
    </g>

    <!-- worried brows: inner ends high, never sloped down to the nose -->
    <g id="brows" fill="none" stroke="#3b342c" stroke-width="6" stroke-linecap="round">
      <path d="M 55 90 Q 69 80 85 87" />
      <path d="M 145 90 Q 131 80 115 87" />
    </g>

    <g fill="none" stroke="#3b342c" stroke-width="4" stroke-linecap="round">
      <path d="M 70 138 L 40 132 M 70 147 L 40 152" />
      <path d="M 130 138 L 160 132 M 130 147 L 160 152" />
    </g>

    <path d="M 100 142 L 90 131 L 110 131 Z" fill="#c97f7c" />

    <g fill="none" stroke="#3b342c" stroke-width="4.5" stroke-linecap="round">
      <path id="m-content" d="M 100 142 Q 100 154 89 149 M 100 142 Q 100 154 111 149" />
      <path id="m-attentif" d="M 100 142 L 100 147 M 93 153 A 7 7 0 1 0 107 153 A 7 7 0 1 0 93 153 Z"
            fill="#4a2b2b" />
      <path id="m-inquiet" d="M 100 142 L 100 147 M 86 155 Q 93 147 100 151 Q 107 155 114 148" />
      <path id="m-fache" d="M 100 142 L 100 146 M 88 152 Q 100 145 112 152 Q 112 163 100 163 Q 88 163 88 152 Z"
            fill="#4a2b2b" />
    </g>
  </g>
</svg>
</div>
<div id="ctxmenu" hidden>
  <button type="button" data-action="fullscreen">Plein écran</button>
  <button type="button" data-action="settings">Réglages</button>
  <hr />
  <button type="button" data-action="quit">Quitter</button>
</div>
<div id="err"></div>
<script src="../dist/levels.js"></script>
<script src="../dist/renderer.js"></script>
</body>
</html>
