<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body {
    background: transparent;
    margin: 0;
    padding: 0;
  }
  body {
    /* the cat is the whole window: nothing may ever scroll here. */
    overflow: hidden;
    color: #e7e9ee;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  /* fixed: the cat fills the whole viewport and body no longer scrolls, so a
     banner in normal flow would sit permanently off-screen. */
  /* ponytail: the DS has no alert component — this is a panel wearing the
     danger border, so it stays a token composition rather than a new look. */
  #err {
    position: fixed;
    left: 0; right: 0; top: 0;
    z-index: 20;
    font-family: var(--hcds-font-sans);
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--hcds-fg);
    background: var(--hcds-surface-raised);
    border: 1px solid var(--hcds-danger);
    border-radius: var(--hcds-radius-control);
    box-shadow: var(--hcds-shadow-panel);
    padding: 10px 14px;
    margin: 12px 16px 0;
  }
  #err:empty { display: none; }

  :focus-visible { outline: 2px solid var(--hcds-accent); outline-offset: 2px; }

  /* --- menu clic droit ---------------------------------------------- */
  /* drawn in the page, not by Menu.popup(): a native menu's look is the OS's
     business, and this one has to match the settings window. */
  #ctxmenu {
    position: fixed;
    left: 0; top: 0;
    z-index: 10;
    min-width: 128px;
    background: var(--hcds-surface-raised);
    border: 1px solid var(--hcds-border);
    border-radius: var(--hcds-radius-panel);
    padding: 4px;
    /* ponytail: shadow-popover is tuned for the light theme and vanishes over a
       transparent overlay, so a plain dark drop is layered under it. */
    box-shadow: var(--hcds-shadow-popover), 0 10px 28px oklch(0% 0 0 / 0.5);
  }
  #ctxmenu[hidden] { display: none; }
  #ctxmenu button {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    height: 32px;
    box-sizing: border-box;
    font-family: var(--hcds-font-sans);
    font-size: 0.875rem;
    line-height: 1.25rem;
    white-space: nowrap;
    text-align: left;
    color: var(--hcds-fg);
    background: none;
    border: 0;
    border-radius: var(--hcds-radius-control);
    /* left padding leaves the ✓ column its 8px + glyph */
    padding: 6px 8px 6px 28px;
    cursor: pointer;
  }
  #ctxmenu button:hover, #ctxmenu button:focus { background: var(--hcds-accent-subtle); }
  #ctxmenu hr { border: 0; height: 1px; background: var(--hcds-border); margin: 4px 0; }
  /* the two checkbox items of the tray menu, mirrored — no new state, the
     body classes main already toggles say everything. */
  #ctxmenu button::before {
    content: '';
    position: absolute;
    left: 8px;
    color: var(--hcds-accent);
  }
  body.fullscreen #ctxmenu [data-action="fullscreen"]::before,
  body.settings-open #ctxmenu [data-action="settings"]::before { content: '✓'; }

  /* --- mascotte ------------------------------------------------------- */
  /* overlay mode: the cat IS the window; renderer.ts drags it manually via IPC. */
  #persona {
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  /* display:block or the inline SVG sits on a text baseline and the few px of
     descender space below it are enough to trigger a scrollbar at 100vh. */
  #cat { width: 100%; height: 100%; display: block; }

  /* fullscreen: solid backing so the desktop never shows through behind the
     cat on a projector, and the cat scales to fill the viewport. */
  body.fullscreen {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  body.fullscreen #persona { width: min(90vh, 90vw); height: auto; aspect-ratio: 1 / 1; margin: 0; cursor: default; }

  #cat g, #cat path, #cat circle, #cat ellipse {
    transition: transform 800ms ease-in-out, opacity 800ms ease-in-out, fill 800ms ease-in-out;
    transform-box: fill-box;
  }
  #whole, .ear-l, .ear-r { transform-origin: 50% 100%; }
  .eye-l, .eye-r, .pupil { transform-origin: center; }

  /* Facial expressions cross-fade; the round silhouette itself only moves. */
  #m-content, #m-attentif, #m-inquiet, #m-fache,
  #worried-brows, #overwhelmed-eyes, #tears { opacity: 0; }
  .content #m-content, .attentif #m-attentif,
  .inquiet #m-inquiet, .fache #m-fache { opacity: 1; }
  .inquiet #worried-brows { opacity: 1; }
  .fache #eyes-open { opacity: 0; }
  .fache #overwhelmed-eyes, .fache #tears { opacity: 1; }

  .content  #halo { fill: #69c982; }
  .attentif #halo { fill: #f1c84f; }
  .inquiet  #halo { fill: #f3a252; }
  .fache    #halo { fill: #ed786d; }

  .content .ear-l { transform: rotate(-4deg); }
  .content .ear-r { transform: rotate(4deg); }

  .attentif #whole { transform: translateY(-4px); }
  .attentif .ear-l { transform: rotate(3deg); }
  .attentif .ear-r { transform: rotate(-3deg); }
  .attentif .pupil { transform: scale(1.3); }

  .inquiet #whole { transform: translateY(3px) scaleY(0.98); }
  .inquiet .ear-l { transform: rotate(-27deg); }
  .inquiet .ear-r { transform: rotate(27deg); }
  .inquiet .eye-l { transform: translateX(2px) scaleY(0.88); }
  .inquiet .eye-r { transform: translateX(-2px) scaleY(0.88); }

  /* fache means overwhelmed, not hostile: low posture, pinned ears and tears. */
  .fache #whole { transform: translateY(7px) scaleY(0.96) scaleX(1.02); }
  .fache .ear-l { transform: rotate(-55deg) translate(-2px, 4px); }
  .fache .ear-r { transform: rotate(55deg) translate(2px, 4px); }
</style>
</head>
<body>
<div id="persona">
<svg id="cat" class="content" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle id="halo" cx="100" cy="103" r="92" fill="#69c982" opacity="0.92" />

  <g id="whole">
    <!-- Two flat colour passes keep the silhouette soft and readable at a
         distance while leaving each ear free to rotate. -->
    <g fill="#37312b" stroke="#37312b" stroke-width="9" stroke-linejoin="round">
      <path class="ear-l" d="M 50 76 L 57 29 Q 58 20 65 27 L 95 58 Z" />
      <path class="ear-r" d="M 150 76 L 144 27 Q 143 19 137 26 L 105 58 Z" />
      <circle cx="100" cy="111" r="67" />
    </g>

    <g stroke="none">
      <g class="ear-l">
        <path d="M 50 76 L 57 29 Q 58 20 65 27 L 95 58 Z" fill="#9d8768" />
        <path d="M 60 61 L 64 37 L 82 55 Z" fill="#d49a95" />
      </g>
      <g class="ear-r">
        <path d="M 150 76 L 144 27 Q 143 19 137 26 L 105 58 Z" fill="#9d8768" />
        <path d="M 140 61 L 136 37 L 118 55 Z" fill="#d49a95" />
      </g>
      <circle cx="100" cy="111" r="67" fill="#9d8768" />
    </g>

    <!-- The forehead M and cheek stripes are the real cat's strongest cues. -->
    <g fill="none" stroke="#463b31" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="5.5" d="M 80 73 Q 86 56 91 69 Q 96 58 100 70 Q 104 58 109 69 Q 114 56 120 73" />
      <path stroke-width="4.5" d="M 41 116 L 58 111 M 42 130 L 60 124 M 159 116 L 142 111 M 158 130 L 140 124" />
    </g>

    <g id="eyes-open">
      <g class="eye-l">
        <ellipse cx="72" cy="108" rx="20" ry="22" fill="#37312b" />
        <ellipse cx="72" cy="108" rx="15.5" ry="17.5" fill="#a9ad68" />
        <ellipse class="pupil" cx="73" cy="109" rx="6" ry="12" fill="#1d1b18" />
        <circle cx="67" cy="101" r="3.5" fill="#fff" />
        <circle cx="77" cy="116" r="1.6" fill="#fff" />
      </g>
      <g class="eye-r">
        <ellipse cx="128" cy="108" rx="20" ry="22" fill="#37312b" />
        <ellipse cx="128" cy="108" rx="15.5" ry="17.5" fill="#a9ad68" />
        <ellipse class="pupil" cx="127" cy="109" rx="6" ry="12" fill="#1d1b18" />
        <circle cx="123" cy="101" r="3.5" fill="#fff" />
        <circle cx="131" cy="116" r="1.6" fill="#fff" />
      </g>
    </g>

    <g id="worried-brows" fill="none" stroke="#463b31" stroke-width="5" stroke-linecap="round">
      <path d="M 54 88 Q 69 78 85 87" />
      <path d="M 146 88 Q 131 78 115 87" />
    </g>

    <!-- Closed at the outer edge and raised near the nose: tired, never angry. -->
    <g id="overwhelmed-eyes" fill="none" stroke="#37312b" stroke-width="7" stroke-linecap="round">
      <path d="M 54 111 Q 70 124 86 108" />
      <path d="M 114 108 Q 130 124 146 111" />
    </g>

    <g id="tears" fill="#88cdeb">
      <path d="M 55 119 Q 48 130 55 134 Q 63 131 55 119 Z" />
      <path d="M 145 119 Q 152 130 145 134 Q 137 131 145 119 Z" />
    </g>

    <ellipse cx="84" cy="145" rx="22" ry="18" fill="#e9dfcb" />
    <ellipse cx="116" cy="145" rx="22" ry="18" fill="#e9dfcb" />
    <ellipse cx="100" cy="158" rx="18" ry="10" fill="#f1e9da" />
    <path d="M 100 143 L 90 134 Q 100 130 110 134 Z" fill="#b87872" />

    <g fill="none" stroke="#37312b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path id="m-content" d="M 100 143 L 100 149 Q 92 158 84 151 M 100 149 Q 108 158 116 151" />
      <path id="m-attentif" d="M 100 143 L 100 149 M 95 156 Q 100 161 105 156 Q 100 151 95 156 Z" fill="#6e4643" />
      <path id="m-inquiet" d="M 100 143 L 100 150 M 86 160 Q 100 149 114 160" />
      <path id="m-fache" d="M 100 143 L 100 150 M 87 160 Q 93 154 100 160 Q 107 166 113 160" />
    </g>

    <g fill="none" stroke="#37312b" stroke-width="3" stroke-linecap="round">
      <path d="M 70 145 L 39 140 M 70 152 L 38 158 M 130 145 L 161 140 M 130 152 L 162 158" />
    </g>
  </g>
</svg>
</div>
<div id="ctxmenu" hidden>
  <button type="button" data-action="fullscreen">Plein écran</button>
  <button type="button" data-action="settings">Réglages</button>
  <hr />
  <button type="button" data-action="quit">Quitter</button>
</div>
<div id="err"></div>
<script src="../dist/levels.js"></script>
<script src="../dist/renderer.js"></script>
</body>
</html>
